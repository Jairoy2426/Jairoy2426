name: Refresh profile activity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-profile-activity.yml
      - scripts/render-activity.mjs
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Render public contribution calendar
        run: node scripts/render-activity.mjs
      - name: Commit updated artwork
        run: |
          git add assets/activity.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(profile): refresh contribution artwork'
          git push
